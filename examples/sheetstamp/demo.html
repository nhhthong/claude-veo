<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sheetstamp demo</title>
<style>
:root { --bg:#f4f7fc; --ink:#0f172a; --muted:#5b6478; --line:#dfe5f0; --blue:#2563eb; --blue2:#1d4ed8; --soft:#dbeafe; --green:#16a34a; --gsoft:#dcfce7; --orange:#ea7a1a; }
* { box-sizing:border-box; margin:0; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:Inter, "Liberation Sans", sans-serif; color:var(--ink); }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; background:var(--bg); }
.a { position:absolute; }
.blob { border-radius:50%; filter:blur(80px); opacity:.55; }
.paper { background:#fff; border-radius:18px; box-shadow:0 30px 80px -20px #1e3a8a40, 0 2px 6px #0f172a14; overflow:hidden; }
.winbar { height:58px; display:flex; align-items:center; gap:14px; padding:0 22px; border-bottom:1px solid var(--line); font-size:20px; font-weight:600; color:#334155; background:#fbfcfe; }
.fileicon { width:30px; height:30px; border-radius:7px; color:#fff; font-weight:800; font-size:17px; display:grid; place-items:center; }
.doc { font-family:"Liberation Serif", "DejaVu Serif", serif; font-size:23px; line-height:1.85; padding:46px 70px; color:#111827; }
.doc .c { text-align:center; font-weight:700; }
.doc h3 { text-align:center; font-size:30px; margin:18px 0 4px; letter-spacing:.02em; }
.slot { display:inline-grid; vertical-align:baseline; }
.slot > * { grid-area:1/1; }
.blank { color:#94a3b8; letter-spacing:.05em; }
.tag { font-family:"JetBrains Mono", monospace; font-size:19px; font-weight:700; color:var(--blue2); background:var(--soft); border-radius:7px; padding:1px 9px; white-space:nowrap; align-self:center; transform-origin:left center; }
.panel { left:1200px; top:300px; width:620px; }
.step { font-size:22px; font-weight:700; color:var(--blue); letter-spacing:.08em; text-transform:uppercase; }
.ptitle { font-size:54px; font-weight:800; letter-spacing:-.02em; line-height:1.12; margin-top:14px; }
.pbody { font-size:28px; color:var(--muted); line-height:1.5; margin-top:22px; }
.pbody b { color:var(--ink); }
.code { font-family:"JetBrains Mono", monospace; font-size:24px; color:var(--blue2); background:var(--soft); border-radius:8px; padding:2px 10px; font-weight:700; }
table.sheet { border-collapse:collapse; font-size:19px; }
.sheet td, .sheet th { border:1px solid #e3e8f0; padding:12px 11px; white-space:nowrap; text-align:left; }
.sheet th { background:#ecfdf3; color:#14532d; font-weight:700; }
.sheet td.n { color:#94a3b8; background:#f8fafc; text-align:center; width:46px; padding:12px 8px; }
.chip { height:62px; border-radius:14px; display:flex; align-items:center; gap:12px; padding:0 22px; font-size:24px; font-weight:600; background:#fff; border:1.5px solid var(--line); box-shadow:0 6px 18px -8px #1e3a8a30; white-space:nowrap; }
.chip .ic { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-size:15px; font-weight:800; color:#fff; }
.ok { width:34px; height:34px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-size:20px; font-weight:800; }
.thumb { width:300px; height:400px; background:#fff; border-radius:12px; box-shadow:0 20px 50px -18px #1e3a8a55, 0 1px 3px #0f172a1a; padding:26px 24px; font-family:"Liberation Serif", serif; font-size:15px; color:#334155; line-height:1.7; }
.thumb .t { text-align:center; font-weight:700; font-size:17px; color:#0f172a; margin:8px 0 12px; }
.fill { background:var(--gsoft); color:#14532d; border-radius:4px; padding:0 4px; font-weight:700; font-family:Inter, sans-serif; font-size:14px; }
.gl { height:7px; border-radius:4px; background:#e2e8f0; margin:9px 0; }
.zip { width:150px; height:170px; border-radius:18px; background:linear-gradient(160deg,#fbbf24,#f59e0b); box-shadow:0 24px 50px -16px #b4530980; display:grid; place-items:center; color:#fff; font-weight:800; font-size:34px; }
.fname { font-family:"JetBrains Mono", monospace; font-size:22px; font-weight:700; color:#92400e; background:#fff7ed; border:1.5px solid #fed7aa; border-radius:12px; padding:10px 18px; white-space:nowrap; }
.card { position:absolute; width:1466px; height:1073px; transform-origin:0 0; border-radius:28px; overflow:hidden; box-shadow:0 50px 110px -30px #1e3a8a70; }
.card img { width:1466px; height:1073px; display:block; }
.ctext { position:absolute; display:flex; align-items:flex-end; padding:0 0 13px 14px; font-weight:700; color:#0b2e7a; font-size:31px; white-space:nowrap; }
.box { position:absolute; border:3px dashed var(--orange); border-radius:10px; background:#fb923c14; }
.blabel { position:absolute; font-size:26px; font-weight:700; color:#fff; background:var(--orange); border-radius:10px; padding:4px 14px; white-space:nowrap; }
.cap { left:0; right:0; bottom:58px; display:flex; justify-content:center; gap:14px; }
.dot { width:46px; height:8px; border-radius:4px; background:#cfd8e8; overflow:hidden; }
.dot i { display:block; height:100%; width:0; background:var(--blue); }
.brand { left:56px; top:40px; display:flex; align-items:center; gap:14px; font-size:28px; font-weight:800; letter-spacing:-.01em; }
.brand img { width:44px; height:44px; }
.end-pill { height:64px; border-radius:999px; background:#fff; border:1.5px solid var(--line); display:inline-flex; align-items:center; gap:12px; padding:0 26px; font-size:26px; font-weight:600; box-shadow:0 10px 30px -14px #1e3a8a40; }
svg.layer { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; pointer-events:none; }
</style></head>
<body><div id="stage"></div>
<script>
// Deterministic: every frame is a pure function of t (seconds).
window.DURATION = 49;
const S = document.getElementById("stage"), NS = "http://www.w3.org/2000/svg";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = p => p * p * (3 - 2 * p);
const eo = p => 1 - Math.pow(1 - p, 3);
const lerp = (a, b, p) => a + (b - a) * p;
const win = (t, a, b, f = 0.6) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); S.style.transform = `scale(${k})`; }
addEventListener("resize", fit); fit();
function el(cls, html, css = "", parent = S) { const e = document.createElement("div"); e.className = cls; e.innerHTML = html; e.style.cssText = css; parent.append(e); return e; }
function fx(e, p, dx = 0, dy = 24, sc = 1) { e.style.opacity = p; e.style.transform = `translate(${(1 - p) * dx}px,${(1 - p) * dy}px) scale(${lerp(sc, 1, p)})`; e.style.visibility = p > 0.001 ? "visible" : "hidden"; }
function svgLayer() { const s = document.createElementNS(NS, "svg"); s.setAttribute("class", "layer"); S.append(s); return s; }
function svgEl(svg, tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); return e; }
// Dashed arrow drawn progressively: sample the hidden guide path up to fraction p.
function arrow(svg, d, color) {
  const guide = svgEl(svg, "path", { d, fill: "none", stroke: "none" });
  const vis = svgEl(svg, "path", { fill: "none", stroke: color, "stroke-width": 3.5, "stroke-dasharray": "10 9", "stroke-linecap": "round" });
  const head = svgEl(svg, "path", { d: "M -14 -8 L 0 0 L -14 8", fill: "none", stroke: color, "stroke-width": 3.5, "stroke-linecap": "round", "stroke-linejoin": "round" });
  const L = guide.getTotalLength();
  return (p, alpha = 1) => {
    if (p <= 0 || alpha <= 0) { vis.setAttribute("d", ""); head.style.opacity = 0; return; }
    const n = 48, pts = [];
    for (let i = 0; i <= n; i++) { const q = guide.getPointAtLength(L * p * i / n); pts.push(`${q.x.toFixed(1)} ${q.y.toFixed(1)}`); }
    vis.setAttribute("d", "M " + pts.join(" L ")); vis.style.opacity = alpha;
    const a = guide.getPointAtLength(Math.max(0, L * p - 2)), b = guide.getPointAtLength(L * p);
    head.setAttribute("transform", `translate(${b.x} ${b.y}) rotate(${Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI})`);
    head.style.opacity = alpha;
  };
}
function panel(step, title, body) { return el("a panel", `<div class="step">${step}</div><div class="ptitle">${title}</div><div class="pbody">${body}</div>`); }

const ROWS = [
  ["Emma Johnson", "1998-03-12", "Sales", "Account Executive", "2026-11-03", "$4,200"],
  ["Liam Chen", "1996-07-25", "Engineering", "Software Engineer", "2026-11-03", "$6,500"],
  ["Sofia Rossi", "2000-01-08", "People", "Recruiter", "2026-11-10", "$4,600"],
  ["Arjun Patel", "1997-09-19", "Marketing", "Content Strategist", "2026-11-10", "$4,800"],
  ["Mai Nguyen", "1999-05-30", "Finance", "Accountant", "2026-11-17", "$4,400"],
];
const COLS = ["Full name", "Date of birth", "Department", "Job title", "Start date", "Salary"];

// Background
const b1 = el("a blob", "", "width:720px;height:720px;background:#bfdbfe;left:-200px;top:-260px");
const b2 = el("a blob", "", "width:640px;height:640px;background:#ddd6fe;right:-160px;bottom:-240px");
const brand = el("a brand", `<img src="assets/icon.svg">Sheetstamp`);

// ---------- Scene 0: intro 0 – 3.6
const i0 = el("a", `<img src="assets/icon.svg" style="width:150px;height:150px">`, "left:885px;top:290px");
const i1 = el("a", `Sheetstamp`, "left:0;right:0;top:470px;text-align:center;font-size:96px;font-weight:800;letter-spacing:-.03em");
const i2 = el("a", `One spreadsheet in, a batch of <span style="color:var(--blue)">contracts</span> and <span style="color:var(--orange)">cards</span> out`, "left:0;right:0;top:600px;text-align:center;font-size:40px;color:var(--muted);font-weight:500");

// ---------- Scene 1: Word template 3.4 – 11.6
const tg = (k, w) => `<span class="slot"><span class="blank">${"…".repeat(w)}</span><span class="tag" data-k="${k}">{{${COLS[k]}}}</span></span>`;
const docWin = el("a paper", `<div class="winbar"><span class="fileicon" style="background:#2b579a">W</span>probation-contract.docx</div>
<div style="height:782px;overflow:hidden;position:relative"><div class="doc" id="docInner">
<div class="c">ACME CORPORATION</div><div class="c" style="font-weight:400;font-style:italic">Human Resources Department</div>
<h3>PROBATIONARY EMPLOYMENT CONTRACT</h3><div class="c" style="font-weight:400">No.: ………………</div><br>
<div>This contract is made between the parties below, by mutual agreement.</div>
<div>Both parties agree to the following terms and conditions.</div>
<div><b>EMPLOYER:</b> Acme Corporation ……………………</div>
<div><b>EMPLOYEE:</b> ${tg(0, 14)}</div>
<div>Date of birth: ${tg(1, 10)} &nbsp; Gender: ………</div>
<div>Permanent address: ……………………………………………</div>
<div>Education: …………………… Major: ……………………</div>
<div style="margin-top:10px"><b>Article 1: General terms</b></div>
<div>1. Contract type: Probation.</div>
<div>2. Duration: 2 months.</div>
<div>3. Start date: ${tg(4, 12)}</div>
<div>4. Place of work: Company office.</div>
<div>5. Department: ${tg(2, 12)}</div>
<div>6. Job title: ${tg(3, 14)}</div>
<div style="margin-top:10px"><b>Article 2: Working hours</b></div>
<div>1. Working time: 8 hours a day, Monday to Friday.</div>
<div style="margin-top:10px"><b>Article 3: Employee rights and duties</b></div>
<div>– Probation salary: ${tg(5, 14)} per month</div>
<div>– Payment method: bank transfer.</div>
<div>– Pay day: the 5th of each month.</div>
</div></div>`, "left:140px;top:130px;width:960px;height:840px");
const docInner = docWin.querySelector("#docInner");
const tags = [...docWin.querySelectorAll(".tag")], blanks = [...docWin.querySelectorAll(".blank")];
const p1 = panel("Step 1 · Word template", "Mark the blanks", `Replace each <b>……</b> with a tag like <span class="code">{{column}}</span>.<br>Tag names match your Excel headers.`);
// tag k appears at time
const TAG_T = { 0: 5.0, 1: 5.5, 4: 7.6, 2: 8.1, 3: 8.6, 5: 9.9 };

// ---------- Scene 2: Excel 11.4 – 17.6
const sheetWin = el("a paper", `<div class="winbar"><span class="fileicon" style="background:#1d6f42">X</span>employees.xlsx</div>
<div style="padding:22px"><table class="sheet"><tr><th class="n" style="background:#f8fafc;color:#94a3b8"></th>${COLS.map(c => `<th>${c}</th>`).join("")}</tr>
${ROWS.map((r, i) => `<tr class="r"><td class="n">${i + 2}</td>${r.map(v => `<td>${v}</td>`).join("")}</tr>`).join("")}</table></div>`, "left:70px;top:330px;width:1100px");
const sheetTable = sheetWin.querySelector("table");
const rowsEl = [...sheetWin.querySelectorAll("tr.r")], headEl = sheetWin.querySelector("tr");
const p2 = panel("Step 2 · Data", "One row per employee", `Use the <b>Excel</b> or <b>CSV</b> file you already have.<br>The first row holds the headers.`);

// ---------- Scene 3: matching 17.4 – 25
const svg3 = svgLayer();
const L3 = [], R3 = [], A3 = [], OK3 = [];
COLS.forEach((c, i) => {
  const y = 190 + i * 110;
  L3.push(el("a chip", `<span class="ic" style="background:#1d6f42">X</span>${c}`, `left:150px;top:${y}px`));
  R3.push(el("a chip", `<span class="ic" style="background:#2b579a">W</span><span style="font-family:'JetBrains Mono';font-size:21px;color:var(--blue2)">{{${c}}}</span>`, `left:700px;top:${y}px;width:420px`));
  OK3.push(el("a ok", "✓", `left:1132px;top:${y + 14}px`));
});
const p3 = panel("Step 3 · Match", "Columns match tags automatically", `Same name, instant match.<br>Missing one? Pick a column, type fixed text, or leave it blank.`);
const cnt3 = el("a", "", "left:150px;top:880px;font-size:26px;font-weight:700;color:var(--green)");

// ---------- Scene 4: export 24.8 – 31.8
const thumbs = ROWS.map((r, i) => el("a thumb", `<div style="text-align:center;font-size:11px;font-weight:700">ACME CORPORATION</div>
<div class="t">PROBATION CONTRACT</div><div class="gl" style="width:90%"></div><div class="gl" style="width:70%"></div>
<div>Employee: <span class="fill">${r[0]}</span></div><div>Born: <span class="fill">${r[1]}</span></div>
<div class="gl" style="width:80%"></div><div>Dept.: <span class="fill">${r[2]}</span></div><div>Title: <span class="fill">${r[3]}</span></div>
<div>Start: <span class="fill">${r[4]}</span></div><div>Salary: <span class="fill">${r[5]}</span></div><div class="gl" style="width:85%"></div><div class="gl" style="width:60%"></div>`, "left:0;top:0"));
const zip = el("a zip", "ZIP", "left:545px;top:760px");
const fname = el("a fname", "Sheetstamp_2026-10-31_093000.zip", "left:360px;top:960px");
const prog = el("a", `<div style="font-size:24px;font-weight:700;margin-bottom:12px" id="pt"></div><div style="width:420px;height:12px;border-radius:6px;background:#e2e8f0;overflow:hidden"><i id="pb" style="display:block;height:100%;background:var(--green);width:0"></i></div>`, "left:140px;top:170px");
const p4 = panel("Step 4 · Export", "One click, every contract", `One <b>.docx</b> per employee,<br>all in <b>a single ZIP</b>.`);

// ---------- Image cards
const FIELD = [ // rects in image pixels (1466 x 1073)
  { k: 0, x: 585, y: 488, w: 520, h: 54 }, { k: 1, x: 590, y: 551, w: 515, h: 54 },
  { k: 2, x: 588, y: 615, w: 517, h: 54 }, { k: 3, x: 588, y: 678, w: 517, h: 54 },
  { k: 6, x: 412, y: 748, w: 648, h: 148 },
];
const LABEL = ["Full name", "Date of birth", "Department", "Job title", , , "Message"];
const WISH = "Wishing you a wonderful year full of joy!";
function card(row, x, y, k) {
  const c = el("card", `<img src="assets/card.jpg">`, `left:${x}px;top:${y}px;transform:scale(${k})`);
  c.texts = FIELD.map(f => {
    const msg = f.k === 6;
    const e = el("ctext", "", `left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;${msg ? "white-space:normal;align-items:flex-start;padding:2px 0 0 0;text-indent:236px;line-height:63px;font-weight:600;font-style:italic;font-size:30px" : ""}`, c);
    e.full = msg ? WISH : row[f.k];
    return e;
  });
  return c;
}
// Scene 5: boxes on the template 31.6 – 38.4
const CK = 0.66;
const tpl = card(["", "", "", ""], 120, 190, CK);
const boxes = FIELD.map(f => el("box", "", `left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px`, tpl));
const blabels = FIELD.map(f => el("blabel", LABEL[f.k], `left:${f.x + f.w + 16}px;top:${f.y + (f.h - 46) / 2}px`, tpl));
const p5 = panel("Step 5 · Image template", "Drag text boxes onto your image", `Each box is a field: <b>Full name</b>, <b>Date of birth</b>…<br>The <b>Message</b> uses the same fixed text for everyone.`);

// Scene 6: generated cards 38.2 – 44.8
const outs = [2, 1, 0].map(ri => card(ROWS[ri], 0, 0, 0.52));
const p6 = panel("Step 6 · Result", "A personal card for everyone", `Export as <b>PNG</b> or <b>JPG</b>,<br>also bundled in one ZIP.`);

// ---------- Outro 44.6 – 49
const o1 = el("a", `<img src="assets/icon.svg" style="width:120px;height:120px">`, "left:900px;top:250px");
const o2 = el("a", "Sheetstamp", "left:0;right:0;top:400px;text-align:center;font-size:84px;font-weight:800;letter-spacing:-.03em");
const o3 = el("a", ["📄 Word contracts", "🖼️ Cards & certificates", "🔒 Offline: your data stays on your computer"].map(s => `<span class="end-pill">${s}</span>`).join(""), "left:0;right:0;top:540px;display:flex;justify-content:center;gap:22px");
const o4 = el("a", "nhhthong.github.io/sheetstamp", "left:0;right:0;top:680px;text-align:center;font-size:32px;font-weight:700;color:var(--blue)");

// Step tracker
const dots = el("a cap", [0, 1, 2, 3, 4, 5].map(() => `<span class="dot"><i></i></span>`).join(""));
const dotI = [...dots.querySelectorAll("i")];
const STEPS = [[3.4, 11.6], [11.4, 17.6], [17.4, 25], [24.8, 31.8], [31.6, 38.4], [38.2, 44.8]];

const svgTop = svgLayer();
const arr = COLS.map((c, i) => { const y = 190 + i * 110 + 31; return arrow(svg3, `M 452 ${y} C 560 ${y} 590 ${y} 690 ${y}`, "#2563eb"); });
// arrows from field boxes to their labels drawn inside scene 5 are not needed: labels sit beside boxes.
// Scene 2 → 3 hint: dashed arrow from sheet header to panel
const arr2 = arrow(svgTop, "M 640 400 C 700 250 1000 220 1185 290", "#16a34a");

window.setT = t => {
  // background drift
  b1.style.transform = `translate(${Math.sin(t / 6) * 60}px,${Math.cos(t / 7) * 40}px)`;
  b2.style.transform = `translate(${Math.cos(t / 5) * 50}px,${Math.sin(t / 8) * 50}px)`;
  fx(brand, win(t, 3.4, 44.8, 0.6), 0, -10);

  // intro
  const io = 1 - seg(t, 3.0, 3.6);
  fx(i0, eo(seg(t, 0.2, 1.0)) * io, 0, 0, 0.6);
  fx(i1, eo(seg(t, 0.6, 1.3)) * io, 0, 30);
  fx(i2, eo(seg(t, 1.1, 1.8)) * io, 0, 30);

  // scene 1
  const s1 = win(t, 3.4, 11.6, 0.7);
  fx(docWin, ease(s1), -60, 0, 0.97);
  fx(p1, ease(win(t, 3.9, 11.4, 0.7)), 60, 0);
  docInner.style.transform = `translateY(${-ease(seg(t, 6.2, 9.6)) * 300}px)`;
  tags.forEach((g, i) => { const k = +g.dataset.k, a = TAG_T[k], p = eo(seg(t, a, a + 0.45)); g.style.opacity = p; g.style.transform = `scale(${lerp(1.4, 1, p)})`; blanks[i].style.opacity = 1 - p; g.style.boxShadow = `0 0 0 ${(1 - p) * 10}px #2563eb${p > 0 && p < 1 ? "33" : "00"}`; });

  // scene 2
  fx(sheetWin, ease(win(t, 11.4, 17.6, 0.7)), -60, 0, 0.97);
  fx(p2, ease(win(t, 11.9, 17.4, 0.7)), 60, 0);
  rowsEl.forEach((r, i) => { const p = eo(seg(t, 12.2 + i * 0.35, 12.7 + i * 0.35)); r.style.opacity = p; r.style.transform = `translateX(${(1 - p) * -30}px)`; });
  const hg = win(t, 14.6, 17.2, 0.5);
  headEl.style.boxShadow = `0 0 0 ${hg * 4}px #16a34a88`; headEl.style.outline = "none";
  arr2(ease(seg(t, 14.8, 16.0)), 1 - seg(t, 16.9, 17.4));

  // scene 3
  const s3 = win(t, 17.4, 25, 0.7);
  L3.forEach((e, i) => fx(e, eo(seg(t, 17.5 + i * 0.12, 18.1 + i * 0.12)) * (1 - seg(t, 24.4, 25)), -40, 0));
  R3.forEach((e, i) => fx(e, eo(seg(t, 17.7 + i * 0.12, 18.3 + i * 0.12)) * (1 - seg(t, 24.4, 25)), 40, 0));
  let done = 0;
  arr.forEach((f, i) => { const a = 18.9 + i * 0.6; f(ease(seg(t, a, a + 0.6)), 1 - seg(t, 24.4, 25)); const ok = eo(seg(t, a + 0.55, a + 0.85)); fx(OK3[i], ok * (1 - seg(t, 24.4, 25)), 0, 0, 0.3); if (t >= a + 0.6) done++; });
  cnt3.textContent = `✓ ${done}/6 columns matched`; fx(cnt3, seg(t, 19, 19.4) * (1 - seg(t, 24.4, 25)), 0, 10);
  fx(p3, ease(win(t, 17.8, 24.8, 0.7)), 60, 0);

  // scene 4
  const s4o = 1 - seg(t, 31.2, 31.8);
  const fan = ease(seg(t, 25.4, 26.8)), into = ease(seg(t, 28.8, 29.8));
  thumbs.forEach((e, i) => {
    const c = i - 2, x0 = 470, y0 = 300;
    const x1 = 470 + c * 190, y1 = 300 + Math.abs(c) * 26, r1 = c * 7;
    const x = lerp(lerp(x0, x1, fan), 545 - 75, into), y = lerp(lerp(y0, y1, fan), 770 - 115, into);
    const sc = lerp(1, 0.25, into), op = seg(t, 25.0 + i * 0.08, 25.4 + i * 0.08) * (1 - seg(t, 29.4, 29.8)) * s4o;
    e.style.transform = `translate(${x}px,${y}px) rotate(${r1 * fan * (1 - into)}deg) scale(${sc})`; e.style.opacity = op; e.style.zIndex = 10 - Math.abs(c);
    e.style.visibility = op > 0 ? "visible" : "hidden";
  });
  const n = Math.min(5, Math.floor(seg(t, 26.0, 28.4) * 5 + 0.0001) + (t >= 28.4 ? 0 : 0));
  document.getElementById("pt").textContent = `Creating contract ${Math.max(1, n)}/5…`.replace("5/5…", "5/5 ✓");
  document.getElementById("pb").style.width = seg(t, 25.8, 28.4) * 100 + "%";
  fx(prog, seg(t, 25.6, 26.0) * s4o, 0, -10);
  fx(zip, eo(seg(t, 28.6, 29.2)) * s4o, 0, 20, 0.6);
  zip.style.transform += ` scale(${1 + 0.08 * Math.sin(seg(t, 29.6, 30.2) * Math.PI)})`;
  fx(fname, eo(seg(t, 29.9, 30.4)) * s4o, 0, 16);
  fx(p4, ease(win(t, 25.2, 31.6, 0.7)), 60, 0);

  // scene 5
  const s5 = win(t, 31.6, 38.4, 0.7);
  tpl.style.opacity = s5; tpl.style.visibility = s5 > 0 ? "visible" : "hidden";
  tpl.style.transform = `translate(${(1 - ease(s5)) * -60}px,0) scale(${CK})`;
  boxes.forEach((b, i) => { const a = 32.6 + i * 0.75, p = ease(seg(t, a, a + 0.5)); b.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`; b.style.opacity = p > 0 ? 1 : 0; fx(blabels[i], eo(seg(t, a + 0.35, a + 0.7)), -20, 0); });
  fx(p5, ease(win(t, 32.0, 38.2, 0.7)), 60, 0);

  // scene 6
  const s6o = 1 - seg(t, 44.2, 44.8);
  const POS = [[430, 400, -5], [290, 300, 4], [130, 190, 0]]; // back to front
  outs.forEach((c, j) => {
    const a = 38.4 + j * 0.45, p = eo(seg(t, a, a + 0.7));
    const [x, y, r] = POS[j];
    c.style.opacity = p * s6o; c.style.visibility = p * s6o > 0 ? "visible" : "hidden";
    c.style.transform = `translate(${x + (1 - p) * 120}px,${y + (1 - p) * 40}px) rotate(${r}deg) scale(0.52)`;
    c.style.zIndex = j;
    c.texts.forEach((e, m) => { const ta = j === 2 ? 39.8 + m * 0.55 : a + 0.4; const q = seg(t, ta, ta + (j === 2 ? 0.55 : 0.01)); e.textContent = e.full.slice(0, Math.round(e.full.length * q)); });
  });
  fx(p6, ease(win(t, 38.6, 44.6, 0.7)), 60, 0);

  // outro
  fx(o1, eo(seg(t, 44.9, 45.6)), 0, 0, 0.6);
  fx(o2, eo(seg(t, 45.2, 45.9)), 0, 26);
  fx(o3, eo(seg(t, 45.7, 46.4)), 0, 26);
  fx(o4, eo(seg(t, 46.2, 46.9)), 0, 20);

  // tracker
  fx(dots, win(t, 3.6, 44.8, 0.6), 0, 10);
  STEPS.forEach(([a, b], i) => dotI[i].style.width = (t >= b - 0.3 ? 100 : seg(t, a, b - 0.3) * 100) + "%");
};
setT(0);
</script></body></html>
