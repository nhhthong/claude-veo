<!doctype html>
<!-- claude-veo example · CI/CD pipeline, 8 s loop, dark theme. Made-up repository and timings. -->
<html lang="en"><head><meta charset="utf-8"><title>CI/CD pipeline</title>
<link rel="stylesheet" href="../../skills/video-engine/kit/veo.css"></head>
<body class="dark"><div id="stage"></div>
<script src="../../skills/video-engine/kit/veo.js"></script>
<script>
const { el, fx, seg, ease, eo, win, layer, arrow, blobs, type } = Veo;
window.DURATION = 8;
const drift = blobs();
const A = (t) => win(t, 0, 8, 0.5);

const title = el("a", "From commit to production", "left:108px;top:66px;font-size:64px;font-weight:800;letter-spacing:-.02em");
const STEPS = [["Commit", "⎇"], ["Build", "⚙"], ["Test", "✓"], ["Deploy", "⇪"], ["Live", "●"]];
const X = (i) => 170 + i * 340;
const g = layer();
const links = STEPS.slice(1).map((_, i) => arrow(g, `M ${X(i) + 250} 360 L ${X(i + 1) - 10} 360`, "#4da3ff"));
const nodes = STEPS.map(([s, ic], i) => el("a", `<div class="ring" style="width:110px;height:110px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:46px;font-weight:800;border:5px solid var(--line);color:var(--muted)">${ic}</div><div style="text-align:center;font-size:30px;font-weight:700;margin-top:16px">${s}</div>`,
  `left:${X(i)}px;top:290px;width:240px`));
const T = [0.6, 1.5, 2.6, 3.9, 5.0]; // when each step finishes
const term = el("a", `<div style="display:flex;gap:8px;margin-bottom:18px"><i style="width:14px;height:14px;border-radius:50%;background:#ff5f57"></i><i style="width:14px;height:14px;border-radius:50%;background:#febc2e"></i><i style="width:14px;height:14px;border-radius:50%;background:#28c840"></i></div><pre class="log" style="margin:0;font-family:var(--mono);font-size:26px;line-height:1.6;color:var(--ink);white-space:pre-wrap"></pre>`,
  "left:270px;top:560px;width:1380px;height:330px;padding:26px 34px;border-radius:20px;background:#0a0c16;border:1px solid var(--line);box-shadow:var(--shadow)");
const log = term.querySelector(".log");
const LINES = [[0.4, "$ git push origin main"], [1.0, "▸ build   compiled 214 modules ........ ok"], [2.0, "▸ test    128 passed, 0 failed ........ ok"], [3.2, "▸ deploy  rolling out to 3 regions .... ok"], [4.6, "✔ live    https://app.example.com  (2m 14s)"]];
const badge = el("a", "✔ Deployed", "left:1430px;top:150px;font-size:30px;font-weight:800;color:#0b0d18;background:var(--ok);border-radius:999px;padding:10px 24px");

window.setT = (t) => {
  drift(t);
  const a = A(t);
  fx(title, eo(seg(t, 0, 0.6)) * a, 0, 20);
  nodes.forEach((n, i) => {
    fx(n, eo(seg(t, 0.1 + i * 0.08, 0.6 + i * 0.08)) * a, 0, 20);
    const ring = n.querySelector(".ring"), start = i ? T[i - 1] : 0.2, done = t >= T[i];
    const active = t >= start && !done;
    ring.style.borderColor = done ? "var(--ok)" : active ? "var(--accent)" : "var(--line)";
    ring.style.color = done ? "var(--ok)" : active ? "var(--accent)" : "var(--muted)";
    ring.style.boxShadow = active ? `0 0 0 ${8 + 6 * Math.sin(t * 8)}px #4da3ff22` : done ? "0 0 30px #5fd29a55" : "none";
  });
  links.forEach((l, i) => l(ease(seg(t, T[i] - 0.1, T[i] + 0.4)), a));
  fx(term, eo(seg(t, 0.2, 0.8)) * a, 0, 30);
  log.innerHTML = "";
  LINES.forEach(([s, line]) => {
    if (t < s) return;
    const span = document.createElement("div");
    type(span, line, seg(t, s, s + 0.5));
    if (line.endsWith("ok") || line.startsWith("✔")) span.style.color = t > s + 0.5 ? "var(--ok)" : "var(--ink)";
    log.append(span);
  });
  fx(badge, eo(seg(t, 5.2, 5.6)) * a, 0, -20, 0.6);
};
setT(0);
</script></body></html>
